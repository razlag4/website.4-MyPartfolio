<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Interactive 3D Planet</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background: radial-gradient(circle,#020202,#000); }
    canvas { display:block; width:100%; height:100%; }
    /* маленький подсказ для курсора */
    body.dragging { cursor:grabbing; cursor:-webkit-grabbing; }
  </style>
</head>
<body>
  <script type="module">
    // Импорты по полному URL (не "three")
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // Сцена и рендер
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Свет
    scene.add(new THREE.AmbientLight(0x888888, 0.6));
    const p = new THREE.PointLight(0xffffff, 1.2);
    p.position.set(5, 3, 5);
    scene.add(p);

    // Текстура планеты (можешь заменить URL)
    const loader = new THREE.TextureLoader();
    const map = loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');

    // Планета
    const geo = new THREE.SphereGeometry(1, 64, 64);
    const mat = new THREE.MeshStandardMaterial({ map, roughness: 0.9, metalness: 0.05 });
    const planet = new THREE.Mesh(geo, mat);
    scene.add(planet);

    // Немного атмосферы (полупрозрачный шар чуть больше)
    const atmMat = new THREE.MeshBasicMaterial({ color: 0x6faeff, transparent: true, opacity: 0.06 });
    const atm = new THREE.Mesh(new THREE.SphereGeometry(1.02, 64, 64), atmMat);
    scene.add(atm);

    // OrbitControls (опционально, можно отключить)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    // отключим вращение колесом и сенсорные жесты, если хочется только drag:
    // controls.enableRotate = false;

    // --- своя логика drag-to-rotate (чтобы поворачивалось влево/вправо по движению) ---
    let isDown = false;
    let startX = 0;
    let lastVX = 0; // скорость для инерции
    const sensitivity = 0.006; // настрой скорость реакции на курсор

    function onPointerDown(e) {
      isDown = true;
      startX = e.clientX ?? e.touches?.[0]?.clientX;
      lastVX = 0;
      document.body.classList.add('dragging');
    }
    function onPointerMove(e) {
      if (!isDown) return;
      const x = e.clientX ?? e.touches?.[0]?.clientX;
      const dx = x - startX;
      startX = x;
      const rot = dx * sensitivity;
      planet.rotation.y += rot;
      lastVX = rot;
    }
    function onPointerUp() {
      isDown = false;
      document.body.classList.remove('dragging');
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    // touch fallback
    renderer.domElement.addEventListener('touchstart', onPointerDown, {passive:true});
    window.addEventListener('touchmove', onPointerMove, {passive:true});
    window.addEventListener('touchend', onPointerUp);

    // Инерция после отпуска (плавный спад)
    let inertia = 0;
    function applyInertia() {
      if (!isDown) {
        inertia *= 0.95; // затухание
        planet.rotation.y += inertia;
        if (Math.abs(inertia) < 0.00001) inertia = 0;
      } else {
        inertia = lastVX;
      }
    }

    // Анимация
    function animate() {
      requestAnimationFrame(animate);
      // лёгкое авто-вращение
      planet.rotation.y += 0.0006;
      applyInertia();
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Адаптив
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
